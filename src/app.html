<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlameBench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: workbench. Components on the left; schematic, toolbox and work area in the centre; assistant on the right. */
  --bg:#eef0f3; --panel:#ffffff; --panel2:#f6f7f9; --ink:#141922; --ink2:#4c5564; --line:#d3d8e0;
  --accent:#1d5fc4; --accent-soft:#e3edfb; --g1:#c2571a;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --mute:#9aa3b0;
  --good:#1a7f4b; --warn:#a36a00; --crit:#b3261e; --good-bg:#e2f3ea; --warn-bg:#fbefd6; --crit-bg:#fbe4e2;
  --display:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark;
  --bg:#12151a; --panel:#1b1f26; --panel2:#222730; --ink:#e9ecf1; --ink2:#a9b1bd; --line:#363d49;
  --accent:#6ea6f2; --accent-soft:#1f3250; --g1:#e58a52; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --mute:#6b7482;
  --good:#5cc48d; --warn:#e0a83a; --crit:#f0837b; --good-bg:#173527; --warn-bg:#3a2d10; --crit-bg:#43201d; } }
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#12151a; --panel:#1b1f26; --panel2:#222730; --ink:#e9ecf1; --ink2:#a9b1bd; --line:#363d49;
  --accent:#6ea6f2; --accent-soft:#1f3250; --g1:#e58a52; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --mute:#6b7482;
  --good:#5cc48d; --warn:#e0a83a; --crit:#f0837b; --good-bg:#173527; --warn-bg:#3a2d10; --crit-bg:#43201d; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);display:flex;flex-direction:column}
h1,h2,h3,h4{margin:0;text-wrap:balance}
h2{font:600 17px/1.2 var(--display);letter-spacing:.01em}
h3{font:600 14px/1.3 var(--body)}
h4{font:600 12px/1.3 var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
p{margin:0}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 10px}
button:hover{border-color:var(--accent)}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.ghost{border-color:transparent;background:transparent;padding:3px 6px}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select,input[type=number],input[type=text]{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 6px}
input[type=range]{accent-color:var(--accent);width:150px;vertical-align:middle}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)} .small{font-size:12px}
header{display:flex;gap:14px;align-items:center;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header .brand{font:600 20px/1 var(--display);letter-spacing:.02em}
header .brand span{color:var(--accent)}
header .tag{color:var(--ink2);font-size:12.5px;flex:1;min-width:200px}
#app{flex:1;min-height:0;display:grid;grid-template-columns:212px minmax(0,1fr) 320px;gap:0}
#app.noai{grid-template-columns:212px minmax(0,1fr)}
#app.noai #ai{display:none}
aside{background:var(--panel);overflow:auto;padding:12px}
#pal{border-right:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
#ai{border-left:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
main{min-width:0;display:flex;flex-direction:column;min-height:0}
.comp{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:8px;background:var(--panel2);cursor:grab;display:flex;flex-direction:column;gap:4px}
.comp b{font-size:13.5px}
.comp .row{display:flex;justify-content:space-between;align-items:center;gap:6px}
#canvasWrap{position:relative;background:var(--panel2);border-bottom:1px solid var(--line);padding:10px 16px 22px;min-height:132px}
#canvasWrap.over{outline:2px dashed var(--accent);outline-offset:-4px}
#canvas{display:flex;gap:34px;flex-wrap:wrap;align-items:flex-start;position:relative;z-index:1}
#wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.blk{width:214px;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.blk.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.blk.drop{outline:2px dashed var(--accent)}
.blk-h{display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--accent);color:#fff;font-weight:600;font-size:12.5px}
.blk-h .lt{font-family:var(--mono);background:#ffffff33;border-radius:4px;padding:0 5px}
.blk-h button{margin-left:auto;color:#fff;border:0;background:transparent;padding:0 4px;font-size:15px;line-height:1}
.blk ol{list-style:none;margin:0;padding:0}
.cell{display:flex;gap:6px;align-items:center;padding:4px 8px;border-top:1px solid var(--line);cursor:pointer;font-size:12.5px}
.cell:hover{background:var(--accent-soft)}
.cell.on{background:var(--accent-soft);font-weight:600}
.cell .n{font-family:var(--mono);color:var(--ink2);width:14px}
.cell .stt{margin-left:auto;font-family:var(--mono);font-size:11.5px}
.stt.ok{color:var(--good)} .stt.q{color:var(--warn)}
.blk-f{padding:4px 8px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink2);display:flex;gap:6px;align-items:center}
.blk-f select{font-size:11.5px;padding:1px 4px;max-width:150px}
.hint{color:var(--ink2);font-size:12.5px;align-self:center;max-width:300px}
#ribbon{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;gap:8px 18px;flex-wrap:wrap;align-items:center;font-size:12.5px}
#ribbon .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#ribbon label{display:flex;gap:5px;align-items:center}
#ribbon .ttl{font:600 11px/1 var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;border-right:1px solid var(--line);padding:4px 9px;background:var(--panel)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff}
#work{flex:1;min-height:0;overflow:auto;padding:14px 16px 28px;display:flex;flex-direction:column;gap:14px}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.steps button{border-radius:6px 6px 0 0;border-bottom:2px solid transparent;background:transparent;border-color:transparent}
.steps button.on{border-bottom-color:var(--accent);color:var(--accent);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px}
.grid2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tw{overflow:auto;max-height:420px;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{position:sticky;top:0;background:var(--panel2);font-weight:600;white-space:nowrap;z-index:1}
td.num,th.num{text-align:right}
tr.sel td{background:var(--accent-soft)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--accent-soft)}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:500;white-space:nowrap;border:1px solid var(--line);background:var(--panel2)}
.pill.in{background:var(--good-bg);color:var(--good);border-color:transparent}
.pill.near{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.out{background:var(--crit-bg);color:var(--crit);border-color:transparent}
.pill.l1{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.l2{background:transparent;border:1px dashed var(--ink2);color:var(--ink)}
.pill.l3{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.l4{background:var(--crit-bg);color:var(--crit);border-color:transparent}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;min-width:70px;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent)}
.kv{display:grid;grid-template-columns:170px minmax(0,1fr);gap:4px 12px;font-size:13px}
.kv dt{color:var(--ink2)} .kv dd{margin:0}
ul.tight{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.note{border-left:3px solid var(--warn);background:var(--warn-bg);padding:7px 10px;border-radius:0 6px 6px 0;font-size:12.5px}
.note.crit{border-color:var(--crit);background:var(--crit-bg)}
.note.ok{border-color:var(--good);background:var(--good-bg)}
.note.info{border-color:var(--accent);background:var(--accent-soft)}
.rng{position:relative;height:14px;background:var(--panel2);border:1px solid var(--line);border-radius:4px}
.rng i{position:absolute;top:1px;bottom:1px;border-radius:3px;background:var(--accent);min-width:3px}
.rng i.w{background:transparent;border:1.5px dashed var(--g1);top:-3px;bottom:-3px}
.big{font:600 22px/1.1 var(--display)}
.tiles{display:flex;gap:10px;flex-wrap:wrap}
.tile{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--panel2);min-width:128px}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{font:11px var(--body);fill:var(--ink2)}
svg.ch .ax{stroke:var(--line)} svg.ch .gr{stroke:var(--line);stroke-dasharray:2 3}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.legend i.h{background:transparent!important;border:2px solid var(--ink);border-radius:0;transform:rotate(45deg);width:8px;height:8px}
.chk{display:flex;gap:6px;align-items:flex-start}
.cols{columns:2 220px;column-gap:18px}
.cols label{display:flex;gap:6px;align-items:baseline;break-inside:avoid;padding:2px 0;font-size:12.5px}
#aiOut{flex:1;min-height:120px;overflow:auto;display:flex;flex-direction:column;gap:8px;font-size:13px}
.src{border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;background:var(--panel2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font-size:12px;padding:3px 8px;border-radius:999px;text-align:left}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#modal.on{display:flex}
#modal .box{background:var(--panel);border-radius:10px;max-width:860px;width:100%;max-height:88vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
textarea{width:100%;min-height:220px;font:12px/1.4 var(--mono);background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
@media (max-width:1180px){ #app{grid-template-columns:190px minmax(0,1fr)} #ai{grid-column:1 / -1;border-left:0;border-top:1px solid var(--line);max-height:340px} }
@media (max-width:760px){ body{height:auto} #app{display:flex;flex-direction:column} #pal{border-right:0;border-bottom:1px solid var(--line)} .grid2,.grid2e,.grid3{grid-template-columns:minmax(0,1fr)} .kv{grid-template-columns:minmax(0,1fr)} #work{overflow:visible} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<header>
  <div class="brand">Flame<span>Bench</span></div>
  <div class="tag">Fire-safety workbench for space habitats. NASA PSI data and external evidence, each with its evidence level stated.</div>
  <button id="btnNb" data-act="nb">Notebook (0)</button>
  <button data-act="example">Example project</button>
  <button data-act="clear">Empty project</button>
  <button data-act="save-ws" id="btnWs" title="Save the workspace in this browser">Save workspace</button>
  <button data-act="toggleAi" id="btnAi">Hide assistant</button>
  <button data-act="about">Sources and method</button>
</header>
<div id="app">
  <aside id="pal" aria-label="Component box"></aside>
  <main>
    <div id="canvasWrap" aria-label="Project schematic"><svg id="wires"></svg><div id="canvas"></div></div>
    <div id="ribbon" aria-label="Toolbox"></div>
    <div id="work"></div>
  </main>
  <aside id="ai" aria-label="Assistant"></aside>
</div>
<div id="modal" role="dialog" aria-modal="true"><div class="box" id="modalBox"></div></div>
<script>
const D = __DATA__;
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = (v, d = 1) => (v == null || isNaN(v)) ? '—' : Number(v).toLocaleString('en-US', {maximumFractionDigits: d});
const ni = n => Number(n).toLocaleString('en-US');
const rngTxt = (r, u, d = 1) => !r ? '—' : (r[0] === r[1] ? nf(r[0], d) : nf(r[0], d) + ' to ' + nf(r[1], d)) + (u ? ' ' + u : '');
const mean = a => a.reduce((s, v) => s + v, 0) / (a.length || 1);
const uniq = a => [...new Set(a)];
const plural = (n, s, p) => n === 1 ? s : (p || s + 's');
const PIL = {prev:'Prevention', det:'Detection', sup:'Suppression', fund:'Fundamental'};
const STL = {solid:'Solid', liquid:'Liquid', gas:'Gas', 'gas-emulator':'Gas (emulates solids)', smoke:'Smoke source', other:'Other', '—':'No table'};
const LVL = {1:['l1','Level 1 · Official PSI'], 2:['l2','Level 2 · Other measured test'], 3:['l3','Level 3 · Calculated'], 4:['l4','Level 4 · Hypothesis']};
const lv = n => `<span class="pill ${LVL[n][0]}">${LVL[n][1]}</span>`;
const T = D.tests.map(a => { const o = {}; D.TF.forEach((k, i) => o[k] = a[i]); return o; });
const INV = D.inv; INV.forEach((v, i) => { v.i = i; v.tests = T.filter(t => t.inv === i); });
const byId = id => INV.find(v => v.id === id);
const ENV = D.env, EXT = D.ext, XT = D.extTests;

/* ---------- record selection and per-variable quality (commit 8) ----------
   One definition of "individual test" for every module, and quality judged per
   variable so a single suspect column never discards a whole observation. */
const LEVEL_LABEL = {
  'test':'Individual test', 'test-day summary':'Test-day summary', 'campaign summary':'Campaign summary',
  'dataset':'Dataset (metadata)', 'session':'Session (metadata)', 'note':'Source footnote', 'visualization':'Pre-test flow visualisation'
};
const isIndividual = t => t.lvl === 'test';
const isAggregate = t => t.lvl === 'test-day summary' || t.lvl === 'campaign summary';
// Per-variable validity. Each analysis declares the variables it needs.
const QV = {
  o2:      t => !!t.qo2 && t.o2b != null,
  pressure:t => !!t.qp && t.p != null,
  flow:    t => !!t.qfl && t.flb != null,
  outcome: t => !!t.qout && !!t.outr
};
/* Select individual tests that are valid for the named variables.
   vars: array of QV keys. warn=true keeps rows carrying a quality warning,
   which are then marked in the view rather than hidden. Returns
   {rows, excluded:{variable:count}, total}. */
function pick(rows, vars, warn){
  const excluded = {}; const out = [];
  rows.forEach(t => {
    if(!isIndividual(t)){ excluded.notAnIndividualTest = (excluded.notAnIndividualTest || 0) + 1; return; }
    let bad = null;
    for(const v of (vars || [])) if(!QV[v](t)){ bad = v; break; }
    if(bad && !(warn && t[{o2:'o2b', pressure:'p', flow:'flb', outcome:'outr'}[bad]] != null)){
      excluded[bad] = (excluded[bad] || 0) + 1; return;
    }
    out.push(t);
  });
  return {rows: out, excluded, total: rows.length};
}
const EXCL_LABEL = {notAnIndividualTest:'not an individual test', o2:'no valid oxygen', pressure:'no pressure data', flow:'no valid flow', outcome:'no recorded outcome'};
const exclNote = e => { const k = Object.keys(e).filter(k => e[k]); return k.length ? k.map(k => `${e[k]} ${EXCL_LABEL[k] || k}`).join(', ') : ''; };
const PSTATE = {measured:['', 'Measured'], assumed:['≈', 'Assumed (cabin pressure)'], no_data:['', 'No data']};
const pMark = t => (t.pstate === 'assumed' ? '≈' : '');

/* Relevance index. The team rated six environments; Earth and EVA preparation
   were not rated separately, so their relevance is derived from the closest
   rated environment and that derivation is shown to the user rather than
   presented as a rating of its own (commit 11). */
const RELIX = {iss:0, vehicle:1, lunar:2, rover:3, mars:4, suit:5};
const RELIX_DERIVED = {
  earth:   {from:'iss',     why:'Earth is not rated separately; the ISS rating is reused because both use a sea-level cabin atmosphere. Gravity differs and is handled by the gravity filter.'},
  eva_prep:{from:'vehicle', why:'EVA preparation is not rated separately; the nominal-cabin rating is reused. The atmosphere differs (26.5 % O₂ at 70.3 kPa) and is handled by the oxygen and pressure filters.'}
};
const relIndex = env => RELIX[env] != null ? RELIX[env] : (RELIX_DERIVED[env] ? RELIX[RELIX_DERIVED[env].from] : 0);
const psi2url = id => 'https://psi.nasa.gov/physci/repo/data/investigations/' + id;
const kpa2psi = p => p / 6.89476;
const pO2 = (pct, ptot) => pct / 100 * ptot;   // partial pressure of oxygen, kPa

/* ---------- state ---------- */
const COMP = {
  C1:{name:'Investigations', desc:'Filter by operating conditions, review the detail and compare investigations.', steps:['Filter by conditions','Detail','Compare']},
  C2:{name:'Extraction for modelling', desc:'Choose variables, fit a simple model, predict a point and export the data.', steps:['Data source','Variables','Model','Export']},
  C3:{name:'Prevention, detection and suppression', desc:'PSI and external evidence, analysis per pillar and actionable drafts.', steps:['Evidence','Pillar analysis','Actionable drafts']}
};
let S = {blocks:[], active:null, nb:[], n:0};
let SAMPLE = null;
function defaults(type){
  if(type==='C1') return {env:'lunar', useO2:true, o2:34, tolO2:5, useP:true, p:56.5, tolP:30, useFl:false, fl:10, tolFl:10, grav:'partial', fuel:'all', pil:'all', psiOnly:false, yax:'p', sel:null, cmp:[], force:false, onlyMatch:true, warn:false, rank:'evidence', autoAx:true, axP:null, axFl:null};
  if(type==='C2') return {invs:['PSI-69'], ds:'norm', exQA:true, onlyTests:true, exCensored:true, cols:null, x:'o2b', y:'K', gcol:'fuel', gval:'Methanol', method:'lin', xq:30, hist:[], last:null, preset:'', cv:false};
  return {env:'lunar', o2:34, p:56.5, pil:'prev', U:5, r:0.318, gexp:0.333, fuelSup:'Heptane', adv:false, supFuelFilter:'all', supPFilter:'all'};
}
function addBlock(type, link){
  const id = String.fromCharCode(65 + (S.n++ % 26));
  const b = {id, type, step:0, link:link||null, st:defaults(type)};
  if(type !== 'C1' && !link){ const c1 = S.blocks.find(x => x.type === 'C1'); if(c1 && S.linkNew) b.link = c1.id; }
  S.blocks.push(b); S.active = id; syncLink(b); renderAll();
}
const blk = id => S.blocks.find(b => b.id === id);
const cur = () => blk(S.active);
function syncLink(b){
  if(!b || !b.link) return; const a = blk(b.link); if(!a){ b.link = null; return; }
  if(b.type === 'C2'){ const ids = srcInvs(b); if(ids.length){ b.st.invs = ids.slice(0, 6); b.st.cols = null; pickXY(b); } b.st.xq = a.st.o2; }
}
/* ---------- environment and matching (C1) ---------- */
function envOf(b){
  if(b.type === 'C1'){ const e = ENV.find(x => x.id === b.st.env) || ENV[0]; const g = b.st.grav === 'ug' ? 0 : b.st.grav === '1g' ? 1 : (e.g > 0 && e.g < 1 ? e.g : 0.165); return {id:e.id, name:e.name, o2:b.st.o2, p:b.st.p, g, src:e.src}; }
  if(b.link && blk(b.link)) return envOf(blk(b.link));
  const e = ENV.find(x => x.id === b.st.env) || ENV[0]; return {id:e.id, name:e.name, o2:b.st.o2, p:b.st.p, g:e.g, src:e.src};
}
/* Environments whose configured parameters are identical for the variables the
   calculations use, so a user is told rather than left to assume a difference. */
function twinEnvs(id){
  const e = ENV.find(x => x.id === id); if(!e) return [];
  return ENV.filter(x => x.id !== id && x.o2 === e.o2 && x.p === e.p && x.g === e.g).map(x => x.name);
}
/* Active scenario, shown wherever a calculation depends on it. */
function scenarioLine(b){
  const e = envOf(b), tw = twinEnvs(e.id), d = RELIX_DERIVED[e.id];

function rowVerdict(t, w){

function evalInv(v, st){

    else if(verdicts.some(x => x.d.missing.length && !x.d.outside.length)) status = 'partial';
    else status = 'related';

  const missCount = {}; verdicts.forEach(x => x.d.missing.forEach(k => missCount[k] = (missCount[k] || 0) + 1));
  const outCount = {}; verdicts.forEach(x => x.d.outside.forEach(k => outCount[k] = (outCount[k] || 0) + 1));

  const G = st.grav === 'ug' ? 1 : st.grav === '1g' ? (v.g1 ? 1 : 0) : (v.proxy ? 1 : v.g1 ? 0.8 : 0.5);

  // with this scenario, and how relevant the investigation is to the mission.
  const parts = {Relevance: 35 * rel, Coverage: 30 * cov, Gravity: 15 * G, Pillar: 10 * pri, Evidence: 10 * E};
  const evidenceScore = 100 * (0.55 * cov + 0.25 * G + 0.20 * E);

}
const RANK_KEY = {evidence:'evidenceScore', relevance:'missionScore', overall:'score'};

      && (st.pil === 'all' || v.pil.includes(st.pil)) && (st.grav !== '1g' || v.g1))

  ticks(yr, 5).forEach(v => { s += `<line class="gr" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${nf(v, 2)}</text>`; });
  s += `<line class="ax" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/><line class="ax" x1="${L}" x2="${L}" y1="${Tp}" y2="${H - B}"/>`;
  s += `<text x="${(L + W - R) / 2}" y="${H - 4}" text-anchor="middle">${esc(o.xl)}</text><text transform="translate(12 ${(Tp + H - B) / 2}) rotate(-90)" text-anchor="middle">${esc(o.yl)}</text>`;

  (o.lines || []).forEach(l => { let d = '', pen = false; for(let i = 0; i <= 120; i++){ const x = xr[0] + (xr[1] - xr[0]) * i / 120, y = l.f(x); if(y == null || isNaN(y) || y < yr[0] - 1e-9 || y > yr[1] + 1e-9){ pen = false; continue; } d += (pen ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(y).toFixed(1); pen = true; } s += `<path d="${d}" fill="none" stroke="${l.c || 'var(--ink)'}" stroke-width="2" ${l.dash ? 'stroke-dasharray="6 4"' : ''}/>`; });

    <li>Measurement qualifiers are preserved. A cell written "~ 21.5" is approximate, "&lt; 0.1" is a bound and "22.1 to 22.0" is a range; none is presented as an exact reading, and bounds are excluded from ordinary regressions by default.</li>
    <li>Oxygen is kept as calibrated initial and calibrated final separately for BASS-II, with a validity flag. Initial oxygen never stands in for final oxygen.</li>
    <li>The sign of the recorded flow is preserved. Charts that compare speed use magnitudes and say so; the signed original stays in the data and in the export.</li>
    <li>Quality is judged per variable. A suspect flow does not discard that row's oxygen and pressure.</li>
    <li>Where a source row leaves the material blank, it is inherited only when the source supports the continuity, and the row it was inherited from is recorded.</li></ul>
   <h3>Use of artificial intelligence</h3><ul class="tight">
    <li>The summaries, the pillar classification and the per-environment relevance of each investigation were written with a language model (Claude) from the PSI metadata and reports, and reviewed by the team.</li>
    <li>The assistant retrieves passages from those texts; where the view allows it, a language model writes the answer using only those passages and cites them. It is instructed to abstain when the passages do not cover the question.</li>
    <li>Numbers in tables and charts come from the data, not from the language model.</li></ul>
   <h3>External sources</h3><ul class="tight">${EXT.map(x => `<li><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.src)}</a>: ${esc(x.title)}${x.status ? ` — <b>${esc(x.status)}</b>` : ''}</li>`).join('')}<li><a href="https://psi.nasa.gov/physci/repo/search?q=combustion&data_source=psi&data_type=investigation" target="_blank" rel="noopener">NASA PSI, combustion investigations</a></li></ul>
   <h3>Limits and assumptions</h3><ul class="tight">
    <li>The boundary equation is calibrated on PMMA rods at about 1 atm. Outside that case it is a reference curve and classifies nothing.</li>
    <li>The gravity bridge U_b = 20·g^n is a modelling hypothesis. Checking it at 1 g cannot validate the exponent, because 1^n = 1 for every n. A sensitivity check over n is provided.</li>
    <li>A fit metric such as R² measures agreement with the rows used to fit. Where the data allow it, a grouped out-of-sample validation is reported separately; where they do not, that is stated rather than papered over.</li>
    <li>Relevance rankings cover six environments. Earth and EVA preparation reuse the closest rated environment, and the view says so.</li>
    <li>Rockets and propellants are outside the scope of this dataset.</li></ul>
   <p class="small muted">Data bundle built ${esc(D.built)}; external and time-dependent claims last checked ${esc(D.checked || D.built)}.</p>`);
}
async function saveFile(name, text){
  if(window.claude && window.claude.use){ try{ const d = await window.claude.use('downloads'); if(d){ await d.save({filename:name, data:text}); return; } }catch(e){ if(e && e.code === 'declined') return; } return showExport(name, text); }
  try{ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type:'text/plain;charset=utf-8'})); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }catch(e){ showExport(name, text); }
}
const EXPORT_LIMIT = 400000;
function showExport(name, text){
  const over = text.length > EXPORT_LIMIT;
  openModal(`<div class="flex"><h2>${esc(name)}</h2><span class="sp"></span><button data-act="copy">Copy</button><button data-act="close">Close</button></div>
   <p class="small muted">This view cannot download files. Copy the content and paste it into a file with that name.</p>
   ${over ? `<div class="note crit"><b>Content truncated.</b> This export is ${ni(text.length)} characters and only the first ${ni(EXPORT_LIMIT)} are shown below, so what you copy is <b>not</b> the complete export. Narrow the selection, or export in parts, before relying on it.</div>` : ''}
   <textarea id="expTxt" readonly>${esc(over ? text.slice(0, EXPORT_LIMIT) : text)}</textarea>`);
}
function download(b, fmt){
  if(fmt === 'nb') return saveFile('flamebench_notebook.md', nbMd());
  if(fmt === 'proto') return saveFile('flamebench_actionable_drafts.md', protoMd(b));
  if(fmt === 'project') return saveFile('flamebench_project.json', exportProject());
  const d = c2Cols(b), st = b.st, on = d.cols.filter(c => st.cols[c.k]), ids = d.raw ? [d.inv.id] : uniq(d.rows.map(r => INV[r.inv].id));
  if(fmt === 'csv') return saveFile('flamebench_data.csv', '﻿' + csvOf(d.rows, on));
  if(fmt === 'json') return saveFile('flamebench_data.json', JSON.stringify({source:'NASA PSI', built:D.built, checked:D.checked || D.built, table: d.raw ? d.file : 'normalised', individualTestsOnly: !!st.onlyTests, censoredExcluded: !!st.exCensored, variables:on.map(c => c.lab), rows:d.rows.map(r => Object.fromEntries(on.map(c => [c.lab, r[c.k] == null ? null : r[c.k]])))}, null, 1));
  if(fmt === 'cite') return saveFile('psi_citations.txt', ids.map(id => { const v = byId(id); return `${v.title} (${v.acr}). NASA Physical Sciences Informatics, ${id}. https://doi.org/${v.doi}`; }).join('\n') + '\n\nPSI data are licensed CC0-1.0. PSI asks that the DOI of every investigation used be cited.\n');
  if(fmt === 'model') return saveFile('flamebench_model.json', JSON.stringify({...st.last, investigations:ids, iterations:st.hist, note:'A fit metric is measured on the rows used to fit. Where present, cv is a grouped out-of-sample validation. A prediction outside the stated range is an extrapolation and is not validated experimentally.'}, null, 1));
}
/* ---------- workspace persistence (commit 14) ----------
   Browser storage is unavailable or throws in some contexts, so every access is
   wrapped and the app keeps working without it. The payload is versioned and
   validated before it is applied. */
const WS_KEY = 'flamebench.workspace';
const WS_VERSION = 1;
function wsAvailable(){ try{ const k = '__fb_probe'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; }catch(e){ return false; } }
const WS_OK = wsAvailable();
function serializeState(){
  return {v:WS_VERSION, saved:new Date().toISOString(), built:D.built,
          blocks:S.blocks.map(b => ({id:b.id, type:b.type, step:b.step, link:b.link, st:b.st})),
          active:S.active, n:S.n, nb:S.nb};
}
const exportProject = () => JSON.stringify(serializeState(), null, 1);
function validState(o){
  return o && typeof o === 'object' && o.v === WS_VERSION && Array.isArray(o.blocks) && Array.isArray(o.nb)
    && o.blocks.every(b => b && typeof b.id === 'string' && COMP[b.type] && b.st && typeof b.st === 'object');
}
function applyState(o){
  // Merge each block's stored settings onto the current defaults, so a payload
  // written by an older build cannot leave a block missing a setting.
  S.blocks = o.blocks.map(b => ({id:b.id, type:b.type, step:+b.step || 0, link:b.link || null, st:{...defaults(b.type), ...b.st}}));
  S.active = S.blocks.some(b => b.id === o.active) ? o.active : (S.blocks[0] ? S.blocks[0].id : null);
  S.n = +o.n || S.blocks.length;
  S.nb = o.nb.filter(n => n && n.title && n.text).map(n => ({title:String(n.title), text:String(n.text), lv:Array.isArray(n.lv) ? n.lv : [1], blk:n.blk || ''}));
  renderAll();
}
function saveWorkspace(){
  if(!WS_OK) return {ok:false, msg:'Browser storage is not available in this view, so the workspace cannot be saved here. Use Download project instead.'};
  try{ localStorage.setItem(WS_KEY, JSON.stringify(serializeState())); return {ok:true, msg:'Workspace saved in this browser.'}; }
  catch(e){ return {ok:false, msg:'Could not save: storage refused the write' + (e && e.name ? ' (' + e.name + ')' : '') + '. Use Download project instead.'}; }
}
function loadWorkspace(){
  if(!WS_OK) return {ok:false, msg:''};
  let raw = null;
  try{ raw = localStorage.getItem(WS_KEY); }catch(e){ return {ok:false, msg:''}; }
  if(!raw) return {ok:false, msg:''};
  let o = null;
  try{ o = JSON.parse(raw); }catch(e){ return {ok:false, msg:'A saved workspace was found but could not be read, so a new one was started.'}; }
  if(!validState(o)) return {ok:false, msg:`A saved workspace was found but its version (${o && o.v}) does not match this build (${WS_VERSION}), so it was not restored. A new workspace was started; the saved one is still in storage.`};
  try{ applyState(o); return {ok:true, msg:`Workspace restored from ${new Date(o.saved).toLocaleString('en-US')}.`}; }
  catch(e){ return {ok:false, msg:'A saved workspace was found but could not be applied, so a new one was started.'}; }
}
function clearWorkspace(){ try{ localStorage.removeItem(WS_KEY); }catch(e){} }
function toast(msg, bad){
  const h = $('#canvasWrap'); if(!h) return;
  const d = document.createElement('div');
  d.className = 'note' + (bad ? ' crit' : ' ok');
  d.style.cssText = 'position:absolute;right:10px;bottom:4px;z-index:5;max-width:420px';
  d.textContent = msg; h.appendChild(d);
  setTimeout(() => d.remove(), 6000);
}

function setKey(b, key, v){ if(key === 'x' || key === 'y' || key === 'gcol' || key === 'gval' || key === 'method' || key === 'exCensored') b.st.last = null; if(key === 'gcol') b.st.gval = ''; if(key === 'x') b.st.xqAuto = true; if(key === 'x' || key === 'y' || key === 'method') b.st.preset = ''; b.st[key] = v; }

  const t = ev.target.closest('[data-act]'); if(!t) { if(ev.target.id === 'modal') $('#modal').classList.remove('on'); return; }

  if(act === 'del'){ ev.stopPropagation(); S.blocks = S.blocks.filter(x => x.id !== t.dataset.id); S.blocks.forEach(x => { if(x.link === t.dataset.id) x.link = null; }); if(S.active === t.dataset.id) S.active = S.blocks.length ? S.blocks[S.blocks.length - 1].id : null; return renderAll(); }
  if(act === 'step'){ S.active = t.dataset.id; blk(S.active).step = +t.dataset.step; syncLink(blk(S.active)); return renderAll(); }
  if(act === 'detail'){ if(ev.target.matches('input')) return; b.st.sel = t.dataset.inv; b.step = 1; return renderAll(); }
  if(act === 'set'){ const v = t.dataset.val; setKey(b, t.dataset.key, v); if(t.dataset.key === 'yax') return renderWork(); renderRibbon(); renderWork(); renderCanvas(); return; }
  if(act === 'force'){ b.st.force = true; return renderWork(); }
  if(act === 'axreset'){ b.st.axP = null; b.st.axFl = null; renderRibbon(); return renderWork(); }
  if(act === 'colsAll'){ const d = c2Cols(b); d.cols.forEach(c => b.st.cols[c.k] = t.dataset.v === '1'); return renderWork(); }
  if(act === 'hist'){
    // Always either save something or say why it cannot (commit 15).

    if(t.dataset.busy === '1') return; t.dataset.busy = '1';
    b.st.hist.push({...b.st.last}); renderWork(); renderCanvas();
    toast(`Iteration ${b.st.hist.length} saved: ${b.st.last.y} against ${b.st.last.x}.`);
    return;
  }
  if(act === 'dl') return download(b, t.dataset.fmt);
  if(act === 'save'){
    const f = finding(b, t.dataset.what);
    if(!f){ toast(t.dataset.what === 'model' ? 'No fitted model to save: choose variables that produce a fit in step 3.' : 'Nothing to save from this step yet.', true); return; }
    S.nb.push({title:f[0], text:f[1], lv:f[2], blk:b.id});
    $('#btnNb').textContent = `Notebook (${S.nb.length})`;
    t.textContent = 'Saved to the notebook'; t.disabled = true;
    toast(`Saved to the notebook: ${f[0]}.`);
    return;
  }
  if(act === 'save-ws'){ const r = saveWorkspace(); toast(r.msg, !r.ok); return; }
  if(act === 'nb') return showNb();
  if(act === 'nbdel'){ S.nb.splice(+t.dataset.i, 1); $('#btnNb').textContent = `Notebook (${S.nb.length})`; return showNb(); }
  if(act === 'about') return showAbout();
  if(act === 'close') return $('#modal').classList.remove('on');
  if(act === 'copy'){ const x = $('#expTxt'); x.select(); try{ navigator.clipboard.writeText(x.value).then(() => t.textContent = 'Copied', () => document.execCommand('copy')); }catch(e){ document.execCommand('copy'); } return; }
  if(act === 'toggleAi'){ const off = $('#app').classList.toggle('noai'); $('#btnAi').textContent = off ? 'Show assistant' : 'Hide assistant'; return drawWires(); }
  if(act === 'aiq'){ $('#aiQ').value = t.dataset.q; return ask(t.dataset.q); }
  if(act === 'askinv'){ const v = byId(t.dataset.inv); $('#app').classList.remove('noai'); const q = `What does ${v.acr} contribute to fire safety?`; $('#aiQ').value = q; return ask(q); }
  if(act === 'example') return example();
  if(act === 'clear'){ S.blocks = []; S.active = null; S.n = 0; return renderAll(); }
  if(act === 'aicmp' && SAMPLE){ const vs = b.st.cmp.map(byId), o = $('#aicmpOut'); o.innerHTML = '<p class="muted">Writing…</p>'; SAMPLE(`Compare these NASA microgravity combustion investigations for a fire-safety engineer. In English, 5 to 7 sentences: how they are alike, how they differ, and whether it makes sense to compare their data. Use only this information, and say plainly if the data should not be combined.\n\n${vs.map(v => `${v.acr}: ${v.sum} Fuel: ${v.fuels}. Variables: ${v.varied}. Measurements: ${v.meas.map(m => D.meas[m]).join(', ')}. Results: ${v.res.join(' ')}`).join('\n\n')}`).then(r => o.innerHTML = `<div class="note info">${esc(r.text)}<div class="small muted">Written by AI from the records above.</div></div>`, () => o.innerHTML = '<p class="small muted">The generative AI did not respond.</p>'); return; }
  if(act === 'nbai' && SAMPLE){ const o = $('#nbSyn'); o.innerHTML = '<p class="muted">Writing…</p>'; SAMPLE(`Write in English an integrated conclusion of 6 to 9 sentences for a fire-safety report on space habitats, using ONLY these findings. State clearly which parts are backed by measured data and which are calculated or hypothesis.\n\n${nbMd()}`).then(r => o.innerHTML = `<div class="note info" style="white-space:pre-wrap">${esc(r.text)}<div class="small muted">AI draft; review it before use.</div></div>`, () => o.innerHTML = '<p class="small muted">The generative AI did not respond.</p>'); return; }
});
document.addEventListener('change', ev => {
  const t = ev.target, b = cur(), act = t.dataset.act;
  if(act === 'cmp'){ const id = t.dataset.inv, c = b.st.cmp; if(t.checked){ if(c.length >= 4){ t.checked = false; toast('Up to four investigations can be compared at once.', true); return; } c.push(id); } else b.st.cmp = c.filter(x => x !== id); b.st.force = false; S.blocks.forEach(syncLink); return renderCanvas(); }

document.addEventListener('input', ev => {
  const t = ev.target, key = t.dataset.bind, b = cur(); if(!key || !b) return;
  const isNum = t.type === 'range' || t.type === 'number' || /^tol/.test(key);
  let v = t.type === 'checkbox' ? t.checked : isNum ? (t.value === '' ? null : +t.value) : t.value;
  if(isNum && v != null && isNaN(v)) return;            // ignore an in-progress entry such as "3e"
  setKey(b, key, v);
  const o = document.querySelector(`[data-out="${key}"]`); if(o) o.textContent = nf(v, 2);
  if(key === 'p'){ const q = document.querySelector('[data-out="psi"]'); if(q) q.textContent = `(${nf(kpa2psi(v), 1)} psi)`; }
  /* The prediction field must not rebuild the work area on every keystroke:
     doing so replaced the input and took the caret with it (commit 15). Only the
     prediction output is updated here; the chart follows on blur or Enter. */
  if(t.dataset.live === 'pred'){ updatePrediction(b); return; }
  if(t.tagName === 'SELECT' && key === 'gcol'){ renderWork(); return; }
  if(b.type === 'C1') S.blocks.forEach(x => { if(x.link === b.id && x.type === 'C2' && key === 'o2') x.st.xq = v; });

/* Recompute only the predicted value and its interpolation/extrapolation note. */
function updatePrediction(b){
  const out = $('#predOut'), kind = $('#predKind'); if(!out) return;
  const st = b.st, m = st.last;
  const d = c2Cols(b), nums = d.cols.filter(c => c.num);
  const cx = nums.find(c => c.k === st.x), cy = nums.find(c => c.k === st.y);
  if(!cx || !cy) return;
  const cats = d.cols.filter(c => !c.num), gc = cats.find(c => c.k === st.gcol);
  let rows = d.rows; if(gc && st.gval) rows = rows.filter(r => r[gc.k] === st.gval);
  const P = rows.map(r => [val(r, cx, st), val(r, cy, st)]).filter(p => p[0] != null && p[1] != null);
  if(P.length < 3) return;
  const xs = P.map(p => p[0]), ys = P.map(p => p[1]);
  const fit = doFit(st.method, xs, ys);
  if(fit.err){ out.textContent = 'no value'; if(kind) kind.textContent = fit.err; return; }
  const xq = +st.xq, lo = Math.min(...xs), hi = Math.max(...xs);
  const yq = fit.f(xq), inside = xq >= lo && xq <= hi;
  out.textContent = (yq == null || !isFinite(yq)) ? 'no value' : nf(yq, 3);
  if(kind) kind.textContent = isNaN(xq) ? 'enter a number' : inside ? 'Interpolation, inside the measured range' : 'Extrapolation, outside the measured range';
  if(m){ m.xq = xq; m.yq = yq; m.inside = inside; }
}
